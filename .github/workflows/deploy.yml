name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one deploy at a time; let an in-progress deploy finish instead of cancelling it
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://farhanakmal.my.id
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build in CI so a broken build never reaches the live site
      - run: npm run build

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          # rsync --delete below would wipe the target, so refuse to run with missing settings
          for v in VPS_HOST VPS_USER VPS_PATH VPS_SSH_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; exit 1; fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload build to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${VPS_PORT:-22}" \
            dist/ "$VPS_USER@$VPS_HOST:${VPS_PATH%/}/"

      - name: Check live site
        run: curl -fsS -o /dev/null https://farhanakmal.my.id/
